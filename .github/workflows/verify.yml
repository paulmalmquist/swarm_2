name: Verify runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - if: matrix.node == 24
        run: npm run demo:all
        env:
          SWARM2_EVIDENCE_DIR: evidence/validation
      - run: npm run demo:manufacturing
      - run: npm run check:report
  warehouse:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: warehouse/requirements-dev.txt
      - run: python -m pip install -r warehouse/requirements-dev.txt
      - run: python warehouse/scripts/verify.py
